<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Provemark C2PA Check banner, 1544×500 (the 772×250 version is this, halved).
     Colours from the verifier's demo site (provemark.github.io/demo). -->
<style>
  html, body { margin: 0; width: 1544px; height: 500px; overflow: hidden; }
  body {
    display: flex; align-items: center; gap: 72px; padding: 0 110px; box-sizing: border-box;
    background: linear-gradient(135deg, #15181d, #0b0c0e);
    font-family: system-ui, -apple-system, "Inter", "Helvetica Neue", Arial, sans-serif;
    color: #e9e9ec;
  }
  img { width: 300px; height: 300px; flex: none; }
  h1 { margin: 0; font-size: 78px; font-weight: 700; letter-spacing: -1.5px; line-height: 1; }
  p { margin: 22px 0 34px; font-size: 32px; color: #a1a1aa; }
  .badges { display: flex; gap: 18px; flex-wrap: nowrap; }
  .badge {
    display: inline-flex; align-items: center; gap: 10px; white-space: nowrap;
    padding: 10px 22px; border: 2px solid currentColor; border-radius: 10px;
    font-size: 26px; font-weight: 600;
  }
  .trusted { color: #4ade80; background: #0f2a1a; }
  .ai { color: #2dd4bf; background: #10302d; }
  .invalid { color: #f87171; background: #2f1414; }
</style>
</head>
<body>
  <img src="icon.svg" alt="">
  <div>
    <h1>Provemark C2PA Check</h1>
    <p>Verifies the Content Credentials of every image you upload.</p>
    <div class="badges">
      <span class="badge trusted">✓ Verified: trusted signer</span>
      <span class="badge ai">AI-generated (signed)</span>
      <span class="badge invalid">✕ Does not verify</span>
    </div>
  </div>
</body>
</html>
